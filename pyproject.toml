[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heteroserve"
version = "0.1.0"
description = "Ascend expert pools managed by Kubernetes with the official vLLM Router"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.scripts]
heteroserve-worker = "heteroserve.worker:main"
heteroserve-router = "heteroserve.router:main"
heteroserve-gateway = "heteroserve.gateway:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
