    \   def __init__(self, encoder, device, buckets):\n        import torch\n    \
    \    import torch_npu\n        if encoder.config.model_type != 'qwen3' or getattr(encoder,\
    \ 'has_sliding_layers', False):\n            raise ValueError('Embedding graphs\
