    \ torch.inference_mode():\n            for size in buckets:\n                ids\
    \ = torch.zeros((1, size), dtype=torch.long, device=device)\n                positions\
    \ = torch.arange(size, device=device).unsqueeze(0)\n                def forward():\n\
    \                    # Same SDPA causal path as a single all-valid prompt.\n \
    \                   # Right padding cannot influence preceding valid tokens.\n\
