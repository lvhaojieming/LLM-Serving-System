apiVersion: apps/v1
kind: Deployment
metadata:
  name: heteroserve-gateway
  namespace: heteroserve
  labels: &id001
    app.kubernetes.io/part-of: heteroserve
    app.kubernetes.io/name: gateway
    io.heteroserve.lab: heteroserve-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        heteroserve.io/runtime-sha256: 040f168f9e7404517d050e394d0fe54634d5a4546751f47198dfa7e908f8287d
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      nodeSelector:
        kubernetes.io/hostname: heteroserve-lab-209
        heteroserve.io/npu-ready: 'true'
      containers:
      - name: gateway
        image: docker.io/heteroserve/ascend-runtime@sha256:440ec6e9625b2344a4c37733f591beeb3a9f8ade57c35dc74d873ce754cb69b4
        imagePullPolicy: Never
        command:
        - python3
        - -m
        - heteroserve.gateway
        - --config
        - /opt/runtime/gateway.json
        env:
        - name: PYTHONPATH
          value: /opt/runtime:/workspace/zhangjinhao/moqe-runtime/python-deps
        - name: HOME
          value: /scratch
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: MOQE_ASCEND_INT4_ADAPTER
          value: '0'
        - name: TE_PARALLEL_COMPILER
          value: '1'
        - name: OMP_NUM_THREADS
          value: '4'
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: '2'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /live
            port: http
          periodSeconds: 5
          failureThreshold: 240
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /live
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        lifecycle:
          preStop:
            exec:
              command:
              - python3
              - -c
              - import urllib.request;urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/drain',method='POST'),timeout=245).read()
        volumeMounts:
        - name: runtime
          mountPath: /opt/runtime
          readOnly: true
        - name: deps
          mountPath: /workspace/zhangjinhao/moqe-runtime/python-deps
          readOnly: true
        - name: scratch
          mountPath: /scratch
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: runtime
        configMap:
          name: heteroserve-gateway
          items:
          - key: heteroserve--__init__.py
            path: heteroserve/__init__.py
          - key: heteroserve--gateway.py
            path: heteroserve/gateway.py
          - key: heteroserve--routing--__init__.py
            path: heteroserve/routing/__init__.py
          - key: heteroserve--routing--runtime.py
            path: heteroserve/routing/runtime.py
          - key: heteroserve--routing--ascend.py
            path: heteroserve/routing/ascend.py
          - key: heteroserve--routing--embedding_graph.py
            path: heteroserve/routing/embedding_graph.py
          - key: heteroserve--routing--service.py
            path: heteroserve/routing/service.py
          - key: heteroserve--routing--client.py
            path: heteroserve/routing/client.py
          - key: gateway.json
            path: gateway.json
      - name: scratch
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: deps
        hostPath:
          path: /var/lib/rancher/k3s/heteroserve-assets/adapter/python-deps
          type: Directory
