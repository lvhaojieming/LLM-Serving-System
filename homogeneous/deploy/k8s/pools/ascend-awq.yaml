    \ so real prefill/decode tensors are compared with the original math.\n      \
    \  audit[\"enabled\"] = True\n        try:\n            return super().execute_model(*args,\
    \ **kwargs)\n        finally:\n            audit[\"enabled\"] = False\n      \
    \      if all(row[\"checked\"] >= audit[\"calls_per_norm\"] for row in audit[\"\
    norms\"].values()):\n                report = {\"rank\": self.rank, \"pid\": os.getpid(),\
    \ \"mode\":\n                          self.execution_optimizations.get(\"qknorm_mode\"\
