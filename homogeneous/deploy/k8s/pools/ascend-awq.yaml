  native_parallel.py: "\"\"\"Process-local TP extension for existing signed INT4 checkpoints;\
    \ weights stay unchanged.\"\"\"\n\n\ndef validate_alignment(input_size, output_sizes,\
    \ group_size, pack_factor):\n    if input_size % group_size:\n        raise ValueError(\"\
    TP shard must preserve whole INT4 quantization groups\")\n    if any(size % pack_factor\
    \ for size in output_sizes):\n        raise ValueError(\"TP output shard must\
    \ preserve packed INT4 columns\")\n\n\ndef install(fast_path=None):\n    import\
    \ torch\n    from native_config import NativeInt4LinearMethod\n    from vllm.model_executor.layers.quantization.awq\
    \ import AWQLinearMethod\n    from vllm.model_executor.parameter import GroupQuantScaleParameter\n\
    \n    def create_weights(self, layer, input_size_per_partition, output_partition_sizes,\n\
    \                       input_size, output_size, params_dtype, **extra_weight_attrs):\n\
    \        validate_alignment(input_size_per_partition, output_partition_sizes,\n\
    \                           self.quant_config.group_size, self.quant_config.pack_factor)\n\
    \        # vLLM's packed parameter loaders already shard K/N and fused QKV projections.\n\
    \        # The native checkpoint stores floating offsets, rather than packed AWQ\
    \ zeros.\n        AWQLinearMethod.create_weights(self, layer, input_size_per_partition,\
    \ output_partition_sizes,\n                                       input_size,\
    \ output_size, params_dtype, **extra_weight_attrs)\n        layer.qweight.pack_factor\
    \ = self.quant_config.pack_factor\n        layer.qzeros = GroupQuantScaleParameter(\n\
    \            data=torch.empty(input_size_per_partition // self.quant_config.group_size,\n\
    \                             sum(output_partition_sizes), dtype=params_dtype),\n\
    \            input_dim=0, output_dim=1, weight_loader=extra_weight_attrs.get(\"\
    weight_loader\"))\n\n    NativeInt4LinearMethod.create_weights = create_weights\n\
    \    if fast_path is not None:\n        if type(fast_path) is not bool:\n    \
    \        raise ValueError(\"INT4 fast_path must be a boolean\")\n        import\
    \ torch_npu\n        original = getattr(NativeInt4LinearMethod, \"_original_native_apply\"\
    , NativeInt4LinearMethod.apply)\n        NativeInt4LinearMethod._original_native_apply\
    \ = original\n\n        def apply(self, layer, x, bias=None):\n            # vLLM\
    \ linear layers normally receive contiguous [tokens, hidden] tensors.\n      \
    \      # Preserve the native fallback for higher dimensions and strided views.\n\
    \            if x.ndim == 2 and x.is_contiguous():\n                return torch_npu.npu_weight_quant_batchmatmul(\n\
    \                    x, layer.qweight, layer.scales, layer.qzeros, bias=bias,\n\
    \                    antiquant_group_size=self.quant_config.group_size)\n    \
    \        return original(self, layer, x, bias)\n\n        NativeInt4LinearMethod.apply\
    \ = apply if fast_path else original\n"
