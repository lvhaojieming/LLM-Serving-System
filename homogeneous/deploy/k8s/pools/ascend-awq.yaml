    \     directory = Path(\"/scratch/qknorm-audit\")\n                directory.mkdir(exist_ok=True)\n\
    \                (directory / (socket.gethostname() + \"-\" + str(os.getpid())\
    \ + \".json\")).write_text(json.dumps(report))\n                self.qknorm_audit_written\
    \ = True\n                print(json.dumps({\"event\": \"qknorm_audit_complete\"\
