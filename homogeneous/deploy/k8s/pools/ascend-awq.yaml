    checked\"] for row in audit[\"norms\"].values()),\n                          \
    \        \"mismatches\": sum(row[\"mismatches\"] for row in audit[\"norms\"].values())}),\
    \ flush=True)\n"
  ascend_execution.py: "\"\"\"Ascend execution fixes and configured Qwen3 normalization\
    \ optimizations.\"\"\"\n\n\ndef install_ascend_pp_cache_views(model):\n    \"\"\
    \"Select cached K/V views by the cache tensor passed for each virtual engine.\n\
    \n    The Ascend V0 backend caches its first pair of views on the implementation\n\
    \    instance. PP schedulers have independent cache tensors, so that pair must\n\
    \    change when the active scheduler changes. Retain each tensor with its views\n\
    \    to avoid repeated slicing and Python object-id reuse.\n    \"\"\"\n    changed\
    \ = 0\n    for _, layer in model.named_modules():\n        impl = getattr(layer,\
    \ \"impl\", None)\n        if impl is None or type(impl).__module__ != \"vllm_ascend.attention.attention\"\
    :\n            continue\n        if not hasattr(impl, \"key_cache\") or not hasattr(impl,\
    \ \"value_cache\"):\n            continue\n        reference = getattr(impl, \"\
    _ascend_pp_cache_reference\", impl.forward)\n        impl._ascend_pp_cache_reference\
    \ = reference\n\n        def bind(backend, original):\n            views = {}\n\
    \n            def forward(layer, query, key, value, kv_cache, *args, **kwargs):\n\
    \                if kv_cache.numel() > 0:\n                    identity = id(kv_cache)\n\
    \                    cached = views.get(identity)\n                    if cached\
    \ is None:\n                        cached = (kv_cache, kv_cache[0], kv_cache[1])\n\
    \                        views[identity] = cached\n                    backend.key_cache,\
    \ backend.value_cache = cached[1:]\n                return original(layer, query,\
    \ key, value, kv_cache, *args, **kwargs)\n            return forward\n\n     \
    \   impl.forward = bind(impl, reference)\n        changed += 1\n    return changed\n\
    \n\ndef install_qwen3_qknorm(model, enabled=True, mode=\"native\", audit=None):\n\
    \    \"\"\"Replace only Q/K head norm callsites; retain their native fallback.\"\
    \"\"\n    import torch\n    import torch_npu\n    if mode not in {\"native\",\
    \ \"preserve_rounding\"}:\n        raise ValueError(\"Unknown Q/K normalization\
    \ mode\")\n\n    changed = 0\n    for name, norm in model.named_modules():\n \
    \       if name.rsplit(\".\", 1)[-1] not in {\"q_norm\", \"k_norm\"}:\n      \
    \      continue\n        if getattr(norm, \"variance_size_override\", None) is\
    \ not None:\n            continue\n        if not getattr(norm, \"has_weight\"\
    , False) or norm.hidden_size != 128:\n            continue\n        original =\
    \ getattr(norm, \"_ascend_qknorm_reference\", norm.forward_native)\n        norm._ascend_qknorm_reference\
    \ = original\n        if enabled:\n            weight = norm.weight\n        \
    \    unit_weight = torch.ones_like(weight) if mode == \"preserve_rounding\" else\
    \ weight\n            epsilon = norm.variance_epsilon\n\n            if audit\
    \ is not None:\n                audit[\"norms\"][name] = {\"checked\": 0, \"mismatches\"\
    : 0, \"shapes\": []}\n\n            def bind(reference, gamma, unit, eps, preserve_rounding,\
    \ label):\n                def fused(x, residual=None):\n                    if\
    \ (residual is not None or x.ndim != 3 or x.shape[-1] != 128 or\n            \
    \                x.dtype != unit.dtype or x.device != unit.device):\n        \
    \                return reference(x, residual)\n                    # Native mode\
    \ is a single weighted RMSNorm kernel. The optional\n                    # compatibility\
    \ mode preserves cast-before-scale rounding.\n                    normalized =\
    \ torch_npu.npu_rms_norm(x, unit, eps)[0]\n                    result = normalized\
    \ * gamma if preserve_rounding else normalized\n                    if audit is\
    \ not None and audit[\"enabled\"]:\n                        record = audit[\"\
    norms\"][label]\n                        if record[\"checked\"] < audit[\"calls_per_norm\"\
    ]:\n                            expected = reference(x)\n                    \
    \        record[\"checked\"] += 1\n                            record[\"shapes\"\
    ].append(list(x.shape))\n                            # NPU floating-point equal\
    \ can accept tiny differences.\n                            # Compare stored FP16/BF16\
    \ bits on CPU during the finite audit.\n                            actual_bits\
    \ = result.detach().cpu().view(torch.int16)\n                            expected_bits\
    \ = expected.detach().cpu().view(torch.int16)\n                            if\
    \ not torch.equal(actual_bits, expected_bits):\n                             \
    \   record[\"mismatches\"] += 1\n                                raise RuntimeError(\"\
    Q/K norm differs from reference at \" + label)\n                    return result\n\
    \                return fused\n\n            norm.forward_native = bind(original,\
    \ weight, unit_weight, epsilon,\n                                       mode ==\
    \ \"preserve_rounding\", name)\n        else:\n            norm.forward_native\
    \ = original\n        changed += 1\n    return changed\n\n\ndef install_qwen3_int4_script_mlp(model):\n\
    \    \"\"\"Run the existing INT4/SwiGLU/INT4 sequence through one C++ interpreter\
    \ call.\n\n    Parameters stay runtime inputs. The original row-parallel all-reduce\
    \ remains\n    outside the script, in exactly the same position as RowParallelLinear.forward.\n\
    \    This reduces Python dispatch; it is not an NPU graph or kernel fusion.\n\
    \    \"\"\"\n    import torch\n    from vllm.model_executor.layers.activation\
    \ import SiluAndMul\n    from vllm.model_executor.layers.linear import tensor_model_parallel_all_reduce\n\
    \    from vllm.model_executor.models.qwen2 import Qwen2MLP\n\n    def local_mlp(x,\
    \ w1, scale1, offset1, w2, scale2, offset2):\n        gate = torch.ops.npu.npu_weight_quant_batchmatmul.default(\n\
    \            x, w1, scale1, offset1, antiquant_group_size=128)\n        hidden\
    \ = torch.ops.npu.npu_swiglu.default(gate)\n        return torch.ops.npu.npu_weight_quant_batchmatmul.default(\n\
    \            hidden, w2, scale2, offset2, antiquant_group_size=128)\n\n    changed\
    \ = 0\n    compiled = None\n    for _, mlp in model.named_modules():\n       \
    \ if not isinstance(mlp, Qwen2MLP) or not isinstance(mlp.act_fn, SiluAndMul):\n\
    \            continue\n        gate, down = mlp.gate_up_proj, mlp.down_proj\n\
    \        if gate.bias is not None or down.bias is not None or not down.input_is_parallel:\n\
    \            continue\n        if any(not all(hasattr(layer, attr) for attr in\
    \ (\"qweight\", \"scales\", \"qzeros\"))\n               for layer in (gate, down)):\n\
    \            continue\n        configs = [layer.quant_method.quant_config for\
    \ layer in (gate, down)]\n        if any(c.get_name() != \"moqe_ascend_int4\"\
    \ or c.group_size != 128 for c in configs):\n            continue\n        params\
    \ = (gate.qweight, gate.scales, gate.qzeros, down.qweight, down.scales, down.qzeros)\n\
    \        if gate.scales.dtype != torch.float16 or gate.scales.device.type != \"\
    npu\":\n            continue\n        if compiled is None:\n            example\
    \ = torch.zeros((1, gate.qweight.shape[0]), device=gate.scales.device, dtype=gate.scales.dtype)\n\
    \            # One script per rank, shared by all layers; no weight constants\
    \ or\n            # batch size arithmetic is captured, and native ops accept varying\
    \ M.\n            compiled = torch.jit.trace(local_mlp, (example, *params), check_trace=False)\n\
    \        original = getattr(mlp, \"_ascend_int4_mlp_reference\", mlp.forward)\n\
    \        mlp._ascend_int4_mlp_reference = original\n\n        def bind(reference,\
    \ graph, tensors, row):\n            def forward(x):\n                if (x.ndim\
    \ != 2 or not x.is_contiguous() or x.dtype != tensors[1].dtype or\n          \
    \              x.device != tensors[1].device or x.shape[-1] != tensors[0].shape[0]):\n\
    \                    return reference(x)\n                local = graph(x, *tensors)\n\
    \                if row.reduce_results and row.tp_size > 1:\n                \
    \    return tensor_model_parallel_all_reduce(local)\n                return local\n\
    \            return forward\n\n        mlp.forward = bind(original, compiled,\
    \ params, down)\n        changed += 1\n    return changed\n"
