apiVersion: apps/v1
kind: Deployment
metadata:
  name: awq-ascend910b-vllm-router
  namespace: heteroserve
  labels: &id001
    app.kubernetes.io/part-of: heteroserve
    app.kubernetes.io/name: router
    heteroserve.io/pool: awq-ascend910b-vllm
    io.heteroserve.lab: heteroserve-lab
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: &id002
      app.kubernetes.io/part-of: heteroserve
      app.kubernetes.io/name: router
      heteroserve.io/pool: awq-ascend910b-vllm
  template:
    metadata:
      labels: *id001
      annotations:
        heteroserve.io/runtime-sha256: 89446f867623101c8edd0d91caa17ce2559f3563e918b410c7765527b0c10a7d
    spec:
      serviceAccountName: heteroserve-discovery
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 300
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - heteroserve-lab-209
                - heteroserve-lab-210
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: *id002
            topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id002
      containers:
      - name: router
        image: docker.io/heteroserve/ascend-runtime@sha256:440ec6e9625b2344a4c37733f591beeb3a9f8ade57c35dc74d873ce754cb69b4
        imagePullPolicy: Never
        command:
        - python3
        - /opt/heteroserve/router.py
        - --config
        - /opt/heteroserve/router.json
        env:
        - name: PYTHONPATH
          value: /router-deps
        - name: HOME
          value: /tmp
        - name: MOQE_ASCEND_INT4_ADAPTER
          value: '0'
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /live
            port: http
          periodSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /live
            port: http
          periodSeconds: 10
          failureThreshold: 6
        lifecycle:
          preStop:
            exec:
              command:
              - python3
              - -c
              - import urllib.request;urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/drain',method='POST'),timeout=245).read()
        volumeMounts:
        - name: runtime
          mountPath: /opt/heteroserve
          readOnly: true
        - name: deps
          mountPath: /router-deps
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: runtime
        configMap:
          name: awq-ascend910b-vllm-router-runtime
      - name: deps
        hostPath:
          path: /var/lib/rancher/k3s/heteroserve-assets/router
          type: Directory
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: awq-ascend910b-vllm-router
  namespace: heteroserve
  labels:
    app.kubernetes.io/part-of: heteroserve
    app.kubernetes.io/name: router
    heteroserve.io/pool: awq-ascend910b-vllm
    io.heteroserve.lab: heteroserve-lab
spec:
  selector:
    app.kubernetes.io/part-of: heteroserve
    app.kubernetes.io/name: router
    heteroserve.io/pool: awq-ascend910b-vllm
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: awq-ascend910b-vllm-router-api
  namespace: heteroserve
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: heteroserve
      app.kubernetes.io/name: router
      heteroserve.io/pool: awq-ascend910b-vllm
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 172.27.0.1/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 172.29.217.2/32
    ports:
    - protocol: TCP
      port: 6443
  - to:
    - ipBlock:
        cidr: 10.107.206.217/32
    ports:
    - protocol: TCP
      port: 16443
