    event\": \"ascend_pp_cache_views_installed\", \"rank\": self.rank,\n         \
    \                     \"attention_count\": count}), flush=True)\n        if self.execution_optimizations.get(\"\
    qwen3_fused_qknorm\", False):\n            if self.model_config.hf_config.model_type\
    \ != \"qwen3\":\n                raise ValueError(\"Q/K norm optimization is validated\
