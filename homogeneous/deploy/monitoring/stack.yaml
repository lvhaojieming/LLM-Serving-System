apiVersion: v1
kind: Namespace
metadata:
  name: heteroserve-monitoring
  labels:
    io.heteroserve.lab: heteroserve-lab
    app.kubernetes.io/part-of: heteroserve-monitoring
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: heteroserve-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: heteroserve-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heteroserve-prometheus
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - endpoints
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: heteroserve-prometheus
roleRef:
  kind: ClusterRole
  name: heteroserve-prometheus
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: heteroserve-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heteroserve-kube-state-metrics
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: heteroserve-kube-state-metrics
roleRef:
  kind: ClusterRole
  name: heteroserve-kube-state-metrics
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: heteroserve-monitoring
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: heteroserve-prometheus
  labels:
    io.heteroserve.lab: heteroserve-lab
    app.kubernetes.io/part-of: heteroserve-monitoring
spec:
  capacity:
    storage: 8Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  local:
    path: /var/lib/rancher/k3s/heteroserve-monitoring/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - heteroserve-lab-217
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus
  namespace: heteroserve-monitoring
spec:
  volumeName: heteroserve-prometheus
  storageClassName: ''
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: heteroserve-grafana
  labels:
    io.heteroserve.lab: heteroserve-lab
    app.kubernetes.io/part-of: heteroserve-monitoring
spec:
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  local:
    path: /var/lib/rancher/k3s/heteroserve-monitoring/grafana
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - heteroserve-lab-217
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  namespace: heteroserve-monitoring
spec:
  volumeName: heteroserve-grafana
  storageClassName: ''
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: heteroserve-monitoring
data:
  prometheus.json: '{"global": {"scrape_interval": "15s", "evaluation_interval": "15s"},
    "rule_files": ["/etc/prometheus/alerts.yaml"], "scrape_configs": [{"job_name":
    "kube-state-metrics", "static_configs": [{"targets": ["kube-state-metrics.heteroserve-monitoring.svc:8080"]}]},
    {"job_name": "inference", "kubernetes_sd_configs": [{"role": "pod", "namespaces":
    {"names": ["heteroserve"]}}], "relabel_configs": [{"source_labels": ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of"],
    "action": "keep", "regex": "heteroserve"}, {"source_labels": ["__meta_kubernetes_pod_label_app_kubernetes_io_name"],
    "action": "keep", "regex": "expert|router"}, {"source_labels": ["__meta_kubernetes_pod_ready"],
    "action": "keep", "regex": "true"}, {"source_labels": ["__address__"], "target_label":
    "__address__", "regex": "([^:]+)(?::\\d+)?", "replacement": "$1:8000"}, {"source_labels":
    ["__meta_kubernetes_pod_node_name"], "target_label": "node"}, {"source_labels":
    ["__meta_kubernetes_pod_uid"], "target_label": "pod_uid"}, {"source_labels": ["__meta_kubernetes_pod_label_heteroserve_io_pool"],
    "target_label": "pool"}, {"source_labels": ["__meta_kubernetes_pod_label_app_kubernetes_io_name"],
    "target_label": "role"}]}]}'
  alerts.yaml: '{"groups": [{"name": "heteroserve", "rules": [{"alert": "NodeNotReady",
    "expr": "kube_node_status_condition{condition=\"Ready\",status=\"true\"} == 0",
    "for": "1m", "labels": {"severity": "critical"}}, {"alert": "ExpertCapacityUnavailable",
    "expr": "kube_deployment_status_replicas_unavailable{namespace=\"heteroserve\"}
    > 0", "for": "3m", "labels": {"severity": "warning"}}, {"alert": "DiscoveryExpired",
    "expr": "heteroserve_discovery_fresh == 0", "for": "30s", "labels": {"severity":
    "critical"}}, {"alert": "InferenceRestartLoop", "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"heteroserve\"}[10m])
    > 2", "for": "1m", "labels": {"severity": "warning"}}]}]}'
  datasources.yaml: '{"apiVersion": 1, "datasources": [{"name": "Prometheus", "uid":
    "prometheus", "type": "prometheus", "url": "http://prometheus:9090", "access":
    "proxy", "isDefault": true}]}'
  dashboards.yaml: '{"apiVersion": 1, "providers": [{"name": "heteroserve", "type":
    "file", "options": {"path": "/etc/grafana/dashboards"}}]}'
  dashboard.json: '{"uid": "heteroserve", "title": "HeteroServe: nodes, devices and
    inference", "schemaVersion": 39, "version": 1, "refresh": "15s", "time": {"from":
    "now-1h", "to": "now"}, "panels": [{"id": 1, "type": "timeseries", "title": "Ready
    nodes", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos":
    {"x": 0, "y": 0, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"}]},
    {"id": 2, "type": "timeseries", "title": "NPU allocatable", "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 0, "w": 12, "h":
    8}, "targets": [{"refId": "A", "expr": "sum by (node) (kube_node_status_allocatable{resource=~\"huawei.*\"})"}]},
    {"id": 3, "type": "timeseries", "title": "Ready experts", "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 8, "w": 12, "h":
    8}, "targets": [{"refId": "A", "expr": "sum(heteroserve_worker_ready)"}]}, {"id":
    4, "type": "timeseries", "title": "Inference inflight", "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 8, "w": 12, "h":
    8}, "targets": [{"refId": "A", "expr": "sum(heteroserve_worker_inflight)"}]},
    {"id": 5, "type": "timeseries", "title": "Discovery freshness", "datasource":
    {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 16, "w":
    12, "h": 8}, "targets": [{"refId": "A", "expr": "heteroserve_discovery_fresh"}]},
    {"id": 6, "type": "timeseries", "title": "Pod restarts", "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 16, "w": 12, "h":
    8}, "targets": [{"refId": "A", "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"heteroserve\"})"}]},
    {"id": 7, "type": "timeseries", "title": "TTFT p95", "datasource": {"type": "prometheus",
    "uid": "prometheus"}, "gridPos": {"x": 0, "y": 24, "w": 12, "h": 8}, "targets":
    [{"refId": "A", "expr": "histogram_quantile(0.95,sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))"}]},
    {"id": 8, "type": "timeseries", "title": "Pending Pods", "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 24, "w": 12, "h":
    8}, "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{namespace=\"heteroserve\",phase=\"Pending\"})"}]}]}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: heteroserve-monitoring
  labels:
    io.heteroserve.lab: heteroserve-lab
    app.kubernetes.io/part-of: heteroserve-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: prometheus
      io.heteroserve.lab: heteroserve-lab
      app.kubernetes.io/part-of: heteroserve-monitoring
  template:
    metadata:
      labels: *id001
    spec:
      nodeSelector:
        kubernetes.io/hostname: heteroserve-lab-217
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: docker.io/prom/prometheus@sha256:6b41f7a45cfbd1d259a78701ee5e14fc2ad9383c9aa5d0427345a18539bc3c91
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.json
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        - --storage.tsdb.retention.size=5GB
        env: []
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: monitoring-config
      - name: data
        persistentVolumeClaim:
          claimName: prometheus
      serviceAccountName: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: heteroserve-monitoring
spec:
  selector:
    app: prometheus
    io.heteroserve.lab: heteroserve-lab
    app.kubernetes.io/part-of: heteroserve-monitoring
  ports:
  - port: 9090
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: heteroserve-monitoring
  labels:
    io.heteroserve.lab: heteroserve-lab
    app.kubernetes.io/part-of: heteroserve-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: grafana
      io.heteroserve.lab: heteroserve-lab
      app.kubernetes.io/part-of: heteroserve-monitoring
  template:
    metadata:
      labels: *id001
    spec:
      nodeSelector:
        kubernetes.io/hostname: heteroserve-lab-217
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: docker.io/grafana/grafana@sha256:c474a2845f8cd51bf09c3f24e036225912fdb21cd0c87ac89527c395585bfa22
        imagePullPolicy: IfNotPresent
        args: []
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
          readOnly: true
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
          readOnly: true
        - name: config
          mountPath: /etc/grafana/dashboards/dashboard.json
          subPath: dashboard.json
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: monitoring-config
      - name: data
        persistentVolumeClaim:
          claimName: grafana
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: heteroserve-monitoring
spec:
  selector:
    app: grafana
    io.heteroserve.lab: heteroserve-lab
    app.kubernetes.io/part-of: heteroserve-monitoring
  ports:
  - port: 3000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: heteroserve-monitoring
  labels:
    io.heteroserve.lab: heteroserve-lab
    app.kubernetes.io/part-of: heteroserve-monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: kube-state-metrics
      io.heteroserve.lab: heteroserve-lab
      app.kubernetes.io/part-of: heteroserve-monitoring
  template:
    metadata:
      labels: *id001
    spec:
      nodeSelector:
        kubernetes.io/hostname: heteroserve-lab-217
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics@sha256:92b46557c71ecac53825772e4827dbcd9fca876b1950060f8fb2f2ef0d7a27af
        imagePullPolicy: IfNotPresent
        args:
        - --resources=nodes,pods,deployments,replicasets,daemonsets,poddisruptionbudgets
        - --namespaces=heteroserve,kube-system,heteroserve-monitoring
        env: []
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        volumeMounts: []
      volumes:
      - name: config
        configMap:
          name: monitoring-config
      serviceAccountName: kube-state-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: heteroserve-monitoring
spec:
  selector:
    app: kube-state-metrics
    io.heteroserve.lab: heteroserve-lab
    app.kubernetes.io/part-of: heteroserve-monitoring
  ports:
  - port: 8080
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-scrape
  namespace: heteroserve
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: heteroserve
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: heteroserve-monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8000
