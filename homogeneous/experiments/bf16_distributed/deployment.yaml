apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bf16-distributed
  namespace: heteroserve
  labels:
    io.heteroserve.lab: heteroserve-lab
    app.kubernetes.io/part-of: heteroserve
    heteroserve.io/distributed-group: bf16-distributed
spec:
  podSelector:
    matchLabels:
      heteroserve.io/distributed-group: bf16-distributed
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          heteroserve.io/distributed-group: bf16-distributed
  egress:
  - to:
    - podSelector:
        matchLabels:
          heteroserve.io/distributed-group: bf16-distributed
