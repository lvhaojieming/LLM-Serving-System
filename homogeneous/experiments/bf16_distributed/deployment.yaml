    \      cancelled = len(state[\"leases\"])\n        for lease in list(state[\"\
    leases\"].values()):\n            lease[\"cancelled\"] = True\n            if\
    \ lease.get(\"response\"):\n                await lease[\"response\"].aclose()\n\
    \            task = lease.get(\"task\")\n            if task is not None and task\
