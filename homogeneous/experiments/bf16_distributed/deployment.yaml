apiVersion: apps/v1
kind: Deployment
metadata:
  name: bf16-distributed-stage-1
  namespace: heteroserve
  labels:
    app.kubernetes.io/part-of: heteroserve
    heteroserve.io/pool: bf16-ascend910b-vllm
    app.kubernetes.io/name: expert-stage
    io.heteroserve.lab: heteroserve-lab
    heteroserve.io/expert: bf16
    heteroserve.io/hardware: ascend910b4
    heteroserve.io/backend: vllm-ascend
    heteroserve.io/model-version: a3b0e57f26191e64
    heteroserve.io/distributed-group: bf16-distributed
    heteroserve.io/stage: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 1320
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: heteroserve
      heteroserve.io/pool: bf16-ascend910b-vllm
      app.kubernetes.io/name: expert-stage
      heteroserve.io/distributed-group: bf16-distributed
      heteroserve.io/stage: '1'
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: heteroserve
        heteroserve.io/pool: bf16-ascend910b-vllm
        app.kubernetes.io/name: expert-stage
        io.heteroserve.lab: heteroserve-lab
        heteroserve.io/expert: bf16
        heteroserve.io/hardware: ascend910b4
        heteroserve.io/backend: vllm-ascend
        heteroserve.io/model-version: a3b0e57f26191e64
        heteroserve.io/distributed-group: bf16-distributed
        heteroserve.io/stage: '1'
      annotations:
        heteroserve.io/runtime-sha256: 4123400ab02166fb43012016fbd3f743ab21de13551d13f7eaa7f3eb4e7acd1d
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      nodeSelector:
        heteroserve.io/hardware: ascend910b4
        heteroserve.io/backend: vllm-ascend
        heteroserve.io/npu-ready: 'true'
        kubernetes.io/hostname: heteroserve-lab-211
      containers:
      - name: expert
        image: docker.io/heteroserve/ascend-runtime@sha256:440ec6e9625b2344a4c37733f591beeb3a9f8ade57c35dc74d873ce754cb69b4
        imagePullPolicy: Never
        command:
        - /bin/bash
        - -ec
        args:
        - mkdir -p /scratch/home /scratch/cache /scratch/vllm; source /usr/local/Ascend/ascend-toolkit/set_env.sh;
          source /usr/local/Ascend/nnal/atb/set_env.sh; exec python3 /opt/heteroserve/runtime.py
          --config /opt/heteroserve/worker.json
        env:
        - name: HOME
          value: /scratch/home
        - name: XDG_CACHE_HOME
          value: /scratch/cache
        - name: VLLM_CACHE_ROOT
          value: /scratch/vllm
        - name: VLLM_NO_USAGE_STATS
          value: '1'
        - name: VLLM_VERSION
          value: 0.8.4
        - name: OMP_NUM_THREADS
          value: '4'
        - name: TE_PARALLEL_COMPILER
          value: '1'
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: MOQE_ASCEND_INT4_ADAPTER
          value: '0'
        - name: PYTHONPATH
          value: /opt/heteroserve:/workspace/zhangjinhao/moqe-runtime/adapter:/workspace/zhangjinhao/moqe-runtime/python-deps:/workspace/vllm:/workspace/vllm-ascend
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: VLLM_USE_V1
          value: '0'
        - name: RAY_USAGE_STATS_ENABLED
          value: '0'
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            huawei.com/Ascend910: '2'
          limits:
            huawei.com/Ascend910: '2'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 240
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 1
        livenessProbe:
          httpGet:
            path: /live
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        volumeMounts:
        - name: runtime
          mountPath: /opt/heteroserve
          readOnly: true
        - name: driver
          mountPath: /usr/local/Ascend/driver
          readOnly: true
        - name: weights
          mountPath: /workspace/zhangjinhao/model/Qwen3-14B
          readOnly: true
        - name: adapter
          mountPath: /workspace/zhangjinhao/moqe-runtime
          readOnly: true
        - name: scratch
          mountPath: /scratch
        - name: tmp
          mountPath: /tmp
        - name: ray-shm
          mountPath: /dev/shm
      volumes:
      - name: runtime
        configMap:
          name: bf16-distributed-stage-1-runtime
      - name: driver
        hostPath:
          path: /usr/local/Ascend/driver
          type: Directory
      - name: weights
        hostPath:
          path: /var/lib/rancher/k3s/heteroserve-assets/models/bf16
          type: Directory
      - name: adapter
        hostPath:
          path: /var/lib/rancher/k3s/heteroserve-assets/adapter
          type: Directory
      - name: scratch
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: ray-shm
        emptyDir:
          medium: Memory
---
apiVersion: v1
