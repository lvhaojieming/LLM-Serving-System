apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ascend-awq.yaml
  - ascend-gptq.yaml
patches:
  - target:
      kind: Namespace
      name: heteroserve
    patch: |-
      - op: replace
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: privileged
