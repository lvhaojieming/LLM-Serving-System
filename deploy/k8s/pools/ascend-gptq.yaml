    heteroserve.io/instance: gptq-01
data:
  worker.py: "\"\"\"Supervise vLLM, admit real model output, and drain direct Pod\
    \ traffic safely.\"\"\"\nimport argparse\nimport asyncio\nimport copy\nfrom contextlib\
    \ import asynccontextmanager\nimport json\nimport logging\nimport os\nfrom pathlib\
    \ import Path\nimport re\nimport signal\nimport time\nimport uuid\n\nimport httpx\n\
    from fastapi import FastAPI, HTTPException, Request\nfrom fastapi.responses import\
    \ Response, StreamingResponse\nimport uvicorn\n\nlog = logging.getLogger(\"heteroserve.worker\"\
    )\nHOP_HEADERS = {\"connection\", \"keep-alive\", \"proxy-authenticate\", \"proxy-authorization\"\
    ,\n               \"te\", \"trailer\", \"transfer-encoding\", \"upgrade\", \"\
    content-length\"}\n\n\ndef identity(config):\n    devices = sorted(int(m.group(1))\
    \ for p in Path(\"/dev\").glob(\"davinci*\")\n                     if (m := re.fullmatch(r\"\
    davinci([0-9]+)\", p.name)))\n    return {\"pod_uid\": os.environ.get(\"POD_UID\"\
    , \"local\"), \"node\": os.environ.get(\"NODE_NAME\", \"local\"),\n          \
    \  \"physical_devices\": devices, \"device_type\": config[\"device_type\"], \"\
    pool\": config[\"pool\"],\n            \"model\": config[\"model\"], \"weights_manifest_sha256\"\
    : config[\"weights_manifest_sha256\"],\n            \"image\": config[\"image\"\
    ], \"instance_id\": config.get(\"instance_id\", \"legacy\"),\n            \"parallelism\"\
    : config.get(\"parallelism\", {\"tp\": 1, \"pp\": 1}),\n            \"expected_devices\"\
    : config.get(\"device_count\", 1)}\n\n\ndef create_app(config, transport=None,\
    \ start_engine=True):\n    # ConfigMap files can change while this process retains\
    \ its startup settings.\n    config = copy.deepcopy(config)\n    state = {\"admitted\"\
    : False, \"draining\": False, \"health_failures\": 0, \"leases\": {},\n      \
    \       \"engine\": None, \"last_error\": None, \"identity\": identity(config),\
    \ \"completed\": 0, \"cancelled\": 0}\n\n    async def admit(client):\n      \
    \  response = await client.get(\"/v1/models\", timeout=10)\n        response.raise_for_status()\n\
    \        if config[\"model\"] not in {m[\"id\"] for m in response.json()[\"data\"\
    ]}:\n            raise RuntimeError(\"Engine reports an unexpected model identity\"\
    )\n        body = {\"model\": config[\"model\"], \"messages\": [{\"role\": \"\
    user\", \"content\": \"What is 17 + 25? Reply with the number only.\"}],\n   \
    \             \"temperature\": 0, \"max_tokens\": 32, \"chat_template_kwargs\"\
    : {\"enable_thinking\": False}}\n        response = await client.post(\"/v1/chat/completions\"\
    , json=body, timeout=config[\"admission_timeout_seconds\"])\n        response.raise_for_status()\n\
    \        answer = response.json()[\"choices\"][0][\"message\"][\"content\"].strip()\n\
    \        if answer != \"42\":\n            raise RuntimeError(\"Real model admission\
    \ did not produce the expected answer\")\n\n    async def monitor(client):\n \
    \       while True:\n            engine = state[\"engine\"]\n            if engine\
    \ is not None and engine.returncode is not None:\n                state.update(admitted=False,\
    \ last_error=\"engine exited\", health_failures=config[\"liveness_failures\"])\n\
    \                log.error(json.dumps({\"event\": \"engine_exited\", \"returncode\"\
    : engine.returncode, **state[\"identity\"]}))\n                os.kill(os.getpid(),\
    \ signal.SIGTERM)\n                return\n            try:\n                response\
    \ = await client.get(\"/health\", timeout=config[\"health_timeout_seconds\"])\n\
    \                response.raise_for_status()\n                if not state[\"\
    admitted\"] and not state[\"draining\"]:\n                    await admit(client)\n\
    \                    state[\"admitted\"] = True\n                    log.info(json.dumps({\"\
    event\": \"model_admitted\", **state[\"identity\"]}))\n                state.update(health_failures=0,\
    \ last_error=None)\n            except Exception as exc:\n                state[\"\
    health_failures\"] += 1\n                state[\"last_error\"] = type(exc).__name__\
    \ + \": \" + str(exc)[:300]\n                if state[\"health_failures\"] >=\
    \ config[\"readiness_failures\"]:\n                    state[\"admitted\"] = False\n\
    \            await asyncio.sleep(config[\"health_interval_seconds\"])\n\n    @asynccontextmanager\n\
    \    async def lifespan(app):\n        if start_engine:\n            if len(state[\"\
    identity\"][\"physical_devices\"]) != config.get(\"device_count\", 1):\n     \
    \           raise RuntimeError(\"Actual NPU allocation does not match the configured\
    \ parallel world size\")\n            state[\"engine\"] = await asyncio.create_subprocess_exec(*config[\"\
    engine_command\"], start_new_session=True,\n                env={**os.environ,\
    \ **config.get(\"engine_env\", {})})\n        async with httpx.AsyncClient(base_url=config[\"\
    engine_url\"], transport=transport,\n                                    timeout=httpx.Timeout(connect=10,\
    \ read=config[\"request_timeout_seconds\"], write=30, pool=10),\n            \
    \                        trust_env=False) as client:\n            app.state.client\
    \ = client\n            watcher = asyncio.create_task(monitor(client))\n     \
    \       try:\n                yield\n            finally:\n                state[\"\
    draining\"] = True\n                watcher.cancel()\n                await asyncio.gather(watcher,\
    \ return_exceptions=True)\n                for lease in list(state[\"leases\"\
    ].values()):\n                    if lease.get(\"response\"):\n              \
    \          await lease[\"response\"].aclose()\n                engine = state[\"\
    engine\"]\n                if engine is not None and engine.returncode is None:\n\
    \                    os.killpg(engine.pid, signal.SIGTERM)\n                 \
    \   try:\n                        await asyncio.wait_for(engine.wait(), config[\"\
    engine_stop_seconds\"])\n                    except asyncio.TimeoutError:\n  \
    \                      os.killpg(engine.pid, signal.SIGKILL)\n               \
    \         await engine.wait()\n\n    app = FastAPI(lifespan=lifespan)\n    app.state.worker\
    \ = state\n\n    @app.get(\"/identity\")\n    async def get_identity():\n    \
    \    return state[\"identity\"]\n\n    @app.get(\"/configuration\")\n    async\
    \ def configuration():\n        return {**state[\"identity\"], \"engine\": config.get(\"\
    engine_parameters\", {}),\n                \"traffic\": {\"max_inflight\": config.get(\"\
    max_inflight\", 8),\n                            \"request_timeout_seconds\":\
    \ config[\"request_timeout_seconds\"]},\n                \"lifecycle\": {\"drain_seconds\"\
    : config[\"drain_seconds\"]},\n                \"ready\": state[\"admitted\"]\
    \ and not state[\"draining\"], \"draining\": state[\"draining\"]}\n\n    @app.get(\"\
    /ready\")\n    @app.get(\"/health\")\n    async def ready():\n        if state[\"\
    draining\"] or not state[\"admitted\"]:\n            raise HTTPException(503,\
    \ \"worker unavailable\")\n        return {\"ready\": True, **state[\"identity\"\
    ]}\n\n    @app.get(\"/live\")\n    async def live():\n        if not state[\"\
    draining\"] and state[\"health_failures\"] >= config[\"liveness_failures\"]:\n\
    \            raise HTTPException(503, \"engine requires recovery\")\n        return\
    \ {\"live\": True, \"inflight\": len(state[\"leases\"])}\n\n    @app.post(\"/drain\"\
    )\n    async def drain(request: Request):\n        if request.client is None or\
    \ request.client.host not in {\"127.0.0.1\", \"::1\"}:\n            raise HTTPException(403,\
    \ \"drain is local-only\")\n        state[\"draining\"] = True\n        deadline\
    \ = time.monotonic() + config[\"drain_seconds\"]\n        while state[\"leases\"\
    ] and time.monotonic() < deadline:\n            await asyncio.sleep(0.05)\n  \
    \      cancelled = len(state[\"leases\"])\n        for lease in list(state[\"\
    leases\"].values()):\n            lease[\"cancelled\"] = True\n            if\
    \ lease.get(\"response\"):\n                await lease[\"response\"].aclose()\n\
    \            task = lease.get(\"task\")\n            if task is not None and task\
    \ is not asyncio.current_task():\n                task.cancel()\n        state[\"\
    cancelled\"] += cancelled\n        log.info(json.dumps({\"event\": \"drained\"\
    , \"cancelled\": cancelled, **state[\"identity\"]}))\n        return {\"draining\"\
    : True, \"cancelled\": cancelled, \"inflight\": len(state[\"leases\"])}\n\n  \
    \  @app.get(\"/metrics\")\n    async def metrics():\n        text = \"\\n\".join([\n\
    \            \"# TYPE heteroserve_worker_inflight gauge\",\n            f\"heteroserve_worker_inflight\
    \ {len(state['leases'])}\",\n            \"# TYPE heteroserve_worker_ready gauge\"\
    ,\n            f\"heteroserve_worker_ready {int(state['admitted'] and not state['draining'])}\"\
    ,\n            \"# TYPE heteroserve_worker_completed_total counter\",\n      \
    \      f\"heteroserve_worker_completed_total {state['completed']}\",\n       \
    \     \"# TYPE heteroserve_worker_cancelled_total counter\",\n            f\"\
    heteroserve_worker_cancelled_total {state['cancelled']}\", \"\"])\n        try:\n\
    \            response = await app.state.client.get(\"/metrics\", timeout=3)\n\
    \            if response.status_code == 200:\n                text += response.text\n\
    \        except httpx.HTTPError:\n            pass\n        return Response(text,\
    \ media_type=\"text/plain\")\n\n    @app.api_route(\"/v1/{path:path}\", methods=[\"\
    GET\", \"POST\"])\n    async def proxy(path: str, request: Request):\n       \
    \ if not state[\"admitted\"] or state[\"draining\"]:\n            raise HTTPException(503,\
    \ \"worker is not accepting new requests\")\n        if request.method == \"POST\"\
    \ and len(state[\"leases\"]) >= config.get(\"max_inflight\", 8):\n           \
    \ raise HTTPException(429, \"worker request budget reached\", headers={\"Retry-After\"\
    : \"1\"})\n        lease_id = uuid.uuid4().hex\n        lease = {\"task\": asyncio.current_task(),\
    \ \"response\": None, \"cancelled\": False}\n        state[\"leases\"][lease_id]\
    \ = lease\n        upstream = None\n        try:\n            body = await request.body()\n\
    \            headers = {k: v for k, v in request.headers.items() if k.lower()\
    \ not in HOP_HEADERS | {\"host\"}}\n            upstream_request = app.state.client.build_request(request.method,\
    \ \"/v1/\" + path,\n                                                         \
    \     params=request.query_params, headers=headers, content=body)\n          \
    \  upstream = await app.state.client.send(upstream_request, stream=True)\n   \
    \         lease[\"response\"] = upstream\n            response_headers = {k: v\
    \ for k, v in upstream.headers.items() if k.lower() not in HOP_HEADERS}\n    \
    \        response_headers.update({\"x-heteroserve-pod-uid\": state[\"identity\"\
    ][\"pod_uid\"],\n                                     \"x-heteroserve-node\":\
    \ state[\"identity\"][\"node\"]})\n            if \"text/event-stream\" in upstream.headers.get(\"\
    content-type\", \"\"):\n                async def stream():\n                \
    \    lease[\"task\"] = asyncio.current_task()\n                    try:\n    \
    \                    async for chunk in upstream.aiter_raw():\n              \
    \              if lease[\"cancelled\"]:\n                                break\n\
    \                            yield chunk\n                        state[\"completed\"\
    ] += 1\n                    finally:\n                        state[\"leases\"\
    ].pop(lease_id, None)\n                        await asyncio.shield(upstream.aclose())\n\
    \                return StreamingResponse(stream(), status_code=upstream.status_code,\
    \ headers=response_headers,\n                                         media_type=\"\
    text/event-stream\")\n            result = await upstream.aread()\n          \
    \  await upstream.aclose()\n            state[\"leases\"].pop(lease_id, None)\n\
    \            state[\"completed\"] += 1\n            return Response(result, status_code=upstream.status_code,\
    \ headers=response_headers)\n        except BaseException:\n            state[\"\
    leases\"].pop(lease_id, None)\n            if upstream is not None:\n        \
    \        await asyncio.shield(upstream.aclose())\n            raise\n\n    return\
    \ app\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n\
    \    parser.add_argument(\"--config\", required=True)\n    args = parser.parse_args()\n\
    \    config = json.loads(Path(args.config).read_text())\n    logging.basicConfig(level=logging.INFO)\n\
    \    logging.getLogger(\"httpx\").setLevel(logging.WARNING)\n    uvicorn.run(create_app(config),\
    \ host=\"0.0.0.0\", port=config[\"port\"], workers=1,\n                access_log=False,\
    \ timeout_graceful_shutdown=config[\"drain_seconds\"] + 10)\n\n\nif __name__ ==\
    \ \"__main__\":\n    main()\n"
  worker.json: "{\n  \"pool\": \"gptq-ascend910b-vllm\",\n  \"instance_id\": \"gptq-01\"\
    ,\n  \"parallelism\": {\n    \"tp\": 1,\n    \"pp\": 1\n  },\n  \"device_count\"\
    : 1,\n  \"model\": \"moqe-qwen3-gptq\",\n  \"device_type\": \"Ascend910B4\",\n\
    \  \"weights_manifest_sha256\": \"2d3cfeb764f1264250d5f1148270dc316a851c00cead215efd5929fef2f4c58b\"\
    ,\n  \"image\": \"docker.io/heteroserve/ascend-runtime@sha256:440ec6e9625b2344a4c37733f591beeb3a9f8ade57c35dc74d873ce754cb69b4\"\
    ,\n  \"port\": 8000,\n  \"engine_url\": \"http://127.0.0.1:8001\",\n  \"engine_command\"\
    : [\n    \"python3\",\n    \"-m\",\n    \"vllm.entrypoints.openai.api_server\"\
    ,\n    \"--model\",\n    \"/workspace/zhangjinhao/model/Qwen3-14B-GPTQ-Ascend-INT4\"\
    ,\n    \"--served-model-name\",\n    \"moqe-qwen3-gptq\",\n    \"--host\",\n \
    \   \"127.0.0.1\",\n    \"--port\",\n    \"8001\",\n    \"--tensor-parallel-size\"\
    ,\n    \"1\",\n    \"--seed\",\n    \"0\",\n    \"--dtype\",\n    \"float16\"\
    ,\n    \"--max-model-len\",\n    \"4096\",\n    \"--max-num-seqs\",\n    \"2\"\
    ,\n    \"--gpu-memory-utilization\",\n    \"0.5\",\n    \"--max-num-batched-tokens\"\
    ,\n    \"2048\",\n    \"--enforce-eager\",\n    \"--disable-frontend-multiprocessing\"\
    ,\n    \"--disable-log-requests\",\n    \"--quantization\",\n    \"moqe_ascend_int4\"\
    \n  ],\n  \"engine_parameters\": {\n    \"dtype\": \"float16\",\n    \"max_model_len\"\
    : 4096,\n    \"max_num_seqs\": 2,\n    \"gpu_memory_utilization\": 0.5,\n    \"\
    max_num_batched_tokens\": 2048,\n    \"enforce_eager\": true,\n    \"disable_frontend_multiprocessing\"\
    : true,\n    \"disable_log_requests\": true,\n    \"quantization\": \"moqe_ascend_int4\"\
    \n  },\n  \"engine_env\": {\n    \"MOQE_ASCEND_INT4_ADAPTER\": \"1\",\n    \"\
    MOQE_ASCEND_INT4_PARALLEL\": \"0\"\n  },\n  \"health_interval_seconds\": 3,\n\
    \  \"health_timeout_seconds\": 10,\n  \"readiness_failures\": 3,\n  \"liveness_failures\"\
    : 10,\n  \"admission_timeout_seconds\": 120,\n  \"request_timeout_seconds\": 180,\n\
    \  \"drain_seconds\": 240,\n  \"engine_stop_seconds\": 30,\n  \"max_inflight\"\
    : 8\n}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gptq-ascend910b-vllm-gptq-01
  namespace: heteroserve
  labels: &id001
    app.kubernetes.io/part-of: heteroserve
    heteroserve.io/pool: gptq-ascend910b-vllm
    app.kubernetes.io/name: expert
    io.heteroserve.lab: heteroserve-lab
    heteroserve.io/expert: gptq
    heteroserve.io/hardware: ascend910b4
    heteroserve.io/backend: vllm-ascend
    heteroserve.io/model-version: 2d3cfeb764f12642
    heteroserve.io/instance: gptq-01
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 1320
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: &id002
      app.kubernetes.io/part-of: heteroserve
      heteroserve.io/pool: gptq-ascend910b-vllm
      app.kubernetes.io/name: expert
      heteroserve.io/instance: gptq-01
  template:
    metadata:
      labels: *id001
      annotations:
        heteroserve.io/runtime-sha256: dd73392d60ba91b8db8261d7a3bbf0c19f456712efb1035da4c10d6ba473179e
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
        heteroserve.io/max-inflight: '8'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      nodeSelector:
        heteroserve.io/hardware: ascend910b4
        heteroserve.io/backend: vllm-ascend
        heteroserve.io/npu-ready: 'true'
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - heteroserve-lab-216
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id002
      containers:
      - name: expert
        image: docker.io/heteroserve/ascend-runtime@sha256:440ec6e9625b2344a4c37733f591beeb3a9f8ade57c35dc74d873ce754cb69b4
        imagePullPolicy: Never
        command:
        - /bin/bash
        - -ec
        args:
        - mkdir -p /scratch/home /scratch/cache /scratch/vllm; source /usr/local/Ascend/ascend-toolkit/set_env.sh;
          source /usr/local/Ascend/nnal/atb/set_env.sh; exec python3 /opt/heteroserve/worker.py
          --config /opt/heteroserve/worker.json
        env:
        - name: HOME
          value: /scratch/home
        - name: XDG_CACHE_HOME
          value: /scratch/cache
        - name: VLLM_CACHE_ROOT
          value: /scratch/vllm
        - name: VLLM_USE_V1
          value: '1'
        - name: VLLM_NO_USAGE_STATS
          value: '1'
        - name: VLLM_VERSION
          value: 0.8.4
        - name: OMP_NUM_THREADS
          value: '4'
        - name: TE_PARALLEL_COMPILER
          value: '1'
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: MOQE_ASCEND_INT4_ADAPTER
          value: '0'
        - name: PYTHONPATH
          value: /workspace/zhangjinhao/moqe-runtime/adapter:/workspace/zhangjinhao/moqe-runtime/python-deps:/workspace/vllm:/workspace/vllm-ascend
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            huawei.com/Ascend910: '1'
          limits:
            huawei.com/Ascend910: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 240
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 1
        livenessProbe:
          httpGet:
            path: /live
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        lifecycle:
          preStop:
            exec:
              command:
              - python3
              - -c
              - import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/drain',method='POST'),timeout=245).read()
        volumeMounts:
        - name: runtime
          mountPath: /opt/heteroserve
          readOnly: true
        - name: driver
          mountPath: /usr/local/Ascend/driver
          readOnly: true
        - name: weights
          mountPath: /workspace/zhangjinhao/model/Qwen3-14B-GPTQ-Ascend-INT4
          readOnly: true
        - name: adapter
          mountPath: /workspace/zhangjinhao/moqe-runtime
          readOnly: true
        - name: scratch
          mountPath: /scratch
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: runtime
        configMap:
          name: gptq-ascend910b-vllm-gptq-01-runtime
      - name: driver
        hostPath:
          path: /usr/local/Ascend/driver
          type: Directory
      - name: weights
        hostPath:
          path: /var/lib/rancher/k3s/heteroserve-assets/models/gptq
          type: Directory
      - name: adapter
        hostPath:
          path: /var/lib/rancher/k3s/heteroserve-assets/adapter
          type: Directory
      - name: scratch
        emptyDir:
          sizeLimit: 20Gi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gptq-ascend910b-vllm-router-runtime
  namespace: heteroserve
  labels:
    app.kubernetes.io/part-of: heteroserve
    app.kubernetes.io/name: router
    heteroserve.io/pool: gptq-ascend910b-vllm
    io.heteroserve.lab: heteroserve-lab
data:
  router.py: "\"\"\"Bounded Kubernetes discovery guard around the official vLLM Router\
    \ data plane.\"\"\"\nimport argparse\nimport asyncio\nfrom contextlib import asynccontextmanager\n\
    from dataclasses import dataclass, field\nimport ipaddress\nimport json\nimport\
    \ logging\nimport os\nfrom pathlib import Path\nimport signal\nimport ssl\nimport\
    \ time\nimport uuid\nfrom urllib.parse import quote\n\nimport httpx\nfrom fastapi\
    \ import FastAPI, HTTPException, Request\nfrom fastapi.responses import Response,\
    \ StreamingResponse\nimport uvicorn\n\nlog = logging.getLogger(\"heteroserve.router\"\
    )\nHOP_HEADERS = {\"connection\", \"keep-alive\", \"proxy-authenticate\", \"proxy-authorization\"\
    , \"te\", \"trailer\", \"transfer-encoding\", \"upgrade\", \"content-length\"\
    }\n\n\ndef discover(pods, slices, pool):\n    eligible = {}\n    for pod in pods[\"\
    items\"]:\n        meta, status = pod[\"metadata\"], pod.get(\"status\", {})\n\
    \        if meta.get(\"deletionTimestamp\") or meta.get(\"labels\", {}).get(\"\
    heteroserve.io/pool\") != pool:\n            continue\n        if status.get(\"\
    phase\") != \"Running\" or not any(c[\"type\"] == \"Ready\" and c[\"status\"]\
    \ == \"True\" for c in status.get(\"conditions\", [])):\n            continue\n\
    \        eligible[meta[\"uid\"]] = pod\n    result = {}\n    for item in slices[\"\
    items\"]:\n        if item[\"metadata\"].get(\"labels\", {}).get(\"kubernetes.io/service-name\"\
    ) != pool:\n            continue\n        for endpoint in item.get(\"endpoints\"\
    , []):\n            conditions = endpoint.get(\"conditions\", {})\n          \
    \  reference = endpoint.get(\"targetRef\", {})\n            uid = reference.get(\"\
    uid\")\n            if conditions.get(\"ready\") is not True or conditions.get(\"\
    terminating\") or conditions.get(\"serving\") is False or reference.get(\"kind\"\
    ) != \"Pod\" or uid not in eligible:\n                continue\n            pod\
    \ = eligible[uid]\n            for address in endpoint.get(\"addresses\", []):\n\
    \                ipaddress.ip_address(address)\n                if address !=\
    \ pod.get(\"status\", {}).get(\"podIP\"):\n                    continue\n    \
    \            annotations = pod[\"metadata\"].get(\"annotations\", {})\n      \
    \          capacity = int(annotations.get(\"heteroserve.io/max-inflight\", \"\
    0\"))\n                if capacity < 0:\n                    raise ValueError(\"\
    Negative worker capacity\")\n                result[uid] = {\"uid\": uid, \"name\"\
    : pod[\"metadata\"][\"name\"], \"ip\": address, \"node\": pod[\"spec\"][\"nodeName\"\
    ],\n                               \"instance_id\": pod[\"metadata\"].get(\"labels\"\
    , {}).get(\"heteroserve.io/instance\", \"legacy\"),\n                        \
    \       \"capacity\": capacity}\n    return result\n\n\n@dataclass\nclass DiscoveryView:\n\
    \    ttl: float\n    endpoints: dict = field(default_factory=dict)\n    last_success:\
    \ float | None = None\n    error: str | None = None\n\n    def fresh(self, now=None):\n\
    \        return self.last_success is not None and (time.monotonic() if now is\
    \ None else now) - self.last_success <= self.ttl\n\n    def update(self, endpoints,\
    \ now=None):\n        self.endpoints = endpoints\n        self.last_success =\
    \ time.monotonic() if now is None else now\n        self.error = None\n\n\nasync\
    \ def reconcile_workers(client, previous, desired):\n    \"\"\"Use the official\
    \ Router management API; never implement worker selection here.\"\"\"\n    def\
    \ urls(endpoints):\n        return {\"http://\" + (\"[\" + item[\"ip\"] + \"]\"\
    \ if \":\" in item[\"ip\"] else item[\"ip\"]) + \":8000\": uid for uid, item in\
    \ endpoints.items()}\n    before, wanted = urls(previous), urls(desired)\n   \
    \ response = await client.get(\"/workers\", timeout=5)\n    response.raise_for_status()\n\
    \    current = {item[\"url\"] for item in response.json()[\"workers\"]}\n    replaced\
    \ = {url for url in current & set(wanted) if url in before and before[url] !=\
    \ wanted[url]}\n    for url in (current - set(wanted)) | replaced:\n        response\
    \ = await client.delete(\"/workers/\" + quote(url, safe=\"\"), timeout=10)\n \
    \       if response.status_code not in {200, 404}:\n            response.raise_for_status()\n\
    \        current.discard(url)\n        log.info(json.dumps({\"event\": \"official_router_worker_removed\"\
    , \"url\": url}))\n    for url in set(wanted) - current:\n        response = await\
    \ client.post(\"/workers\", json={\"url\": url}, timeout=15)\n        response.raise_for_status()\n\
    \        log.info(json.dumps({\"event\": \"official_router_worker_added\", \"\
    url\": url, \"uid\": wanted[url]}))\n\n\ndef create_app(config, api_transport=None,\
    \ core_transport=None, start_core=True):\n    view = DiscoveryView(config[\"discovery_cache_seconds\"\
    ])\n    state = {\"active\": 0, \"draining\": False, \"core\": None, \"completed\"\
    : 0, \"rejected\": 0}\n\n    async def refresh(client):\n        while True:\n\
    \            try:\n                pod_response = await client.get(\"/api/v1/namespaces/\"\
    \ + config[\"namespace\"] + \"/pods\",\n                    params={\"labelSelector\"\
    : \"heteroserve.io/pool=\" + config[\"pool\"]})\n                slice_response\
    \ = await client.get(\"/apis/discovery.k8s.io/v1/namespaces/\" + config[\"namespace\"\
    ] + \"/endpointslices\",\n                    params={\"labelSelector\": \"kubernetes.io/service-name=\"\
    \ + config[\"pool\"]})\n                pod_response.raise_for_status()\n    \
    \            slice_response.raise_for_status()\n                endpoints = discover(pod_response.json(),\
    \ slice_response.json(), config[\"pool\"])\n                await reconcile_workers(app.state.core_client,\
    \ view.endpoints, endpoints)\n                if endpoints != view.endpoints:\n\
    \                    log.info(json.dumps({\"event\": \"discovery_changed\", \"\
    pool\": config[\"pool\"], \"endpoints\": list(endpoints.values())}))\n       \
    \         view.update(endpoints)\n            except Exception as exc:\n     \
    \           view.error = type(exc).__name__\n            await asyncio.sleep(config[\"\
    discovery_interval_seconds\"])\n\n    @asynccontextmanager\n    async def lifespan(app):\n\
    \        account = Path(\"/var/run/secrets/kubernetes.io/serviceaccount\")\n \
    \       headers = {\"Authorization\": \"Bearer \" + (account / \"token\").read_text().strip()}\
    \ if account.exists() else {}\n        verify = ssl.create_default_context(cafile=str(account\
    \ / \"ca.crt\")) if account.exists() else True\n        api_url = config.get(\"\
    api_url\", \"https://\" + os.environ.get(\"KUBERNETES_SERVICE_HOST\", \"kubernetes.default.svc\"\
    ) + \":\" + os.environ.get(\"KUBERNETES_SERVICE_PORT\", \"443\"))\n        if\
    \ start_core:\n            state[\"core\"] = await asyncio.create_subprocess_exec(*config[\"\
    core_command\"], start_new_session=True)\n        async with httpx.AsyncClient(base_url=api_url,\
    \ headers=headers, verify=verify, transport=api_transport, timeout=5, trust_env=False)\
    \ as api, \\\n                httpx.AsyncClient(base_url=config[\"core_url\"],\
    \ transport=core_transport, timeout=httpx.Timeout(connect=10, read=180, write=30,\
    \ pool=10), trust_env=False) as core:\n            app.state.core_client = core\n\
    \            watcher = asyncio.create_task(refresh(api))\n            try:\n \
    \               yield\n            finally:\n                state[\"draining\"\
    ] = True\n                watcher.cancel()\n                await asyncio.gather(watcher,\
    \ return_exceptions=True)\n                process = state[\"core\"]\n       \
    \         if process is not None and process.returncode is None:\n           \
    \         os.killpg(process.pid, signal.SIGTERM)\n                    try:\n \
    \                       await asyncio.wait_for(process.wait(), 30)\n         \
    \           except asyncio.TimeoutError:\n                        os.killpg(process.pid,\
    \ signal.SIGKILL)\n                        await process.wait()\n\n    app = FastAPI(lifespan=lifespan)\n\
    \    app.state.discovery = view\n    app.state.router = state\n\n    def available():\n\
    \        return not state[\"draining\"] and view.fresh() and bool(view.endpoints)\n\
    \n    @app.get(\"/ready\")\n    async def ready():\n        if not available():\n\
    \            raise HTTPException(503, \"no fresh ready worker discovery\")\n \
    \       response = await app.state.core_client.get(\"/health\", timeout=3)\n \
    \       if response.status_code != 200:\n            raise HTTPException(503,\
    \ \"vLLM Router is unavailable\")\n        return {\"ready\": True, \"workers\"\
    : len(view.endpoints)}\n\n    @app.get(\"/live\")\n    async def live():\n   \
    \     process = state[\"core\"]\n        if process is not None and process.returncode\
    \ is not None:\n            raise HTTPException(503, \"vLLM Router exited\")\n\
    \        return {\"live\": True}\n\n    @app.get(\"/discovery\")\n    async def\
    \ discovery():\n        return {\"fresh\": view.fresh(), \"error\": view.error,\
    \ \"endpoints\": list(view.endpoints.values())}\n\n    @app.get(\"/metrics\")\n\
    \    async def metrics():\n        text = \"\\n\".join([\"# TYPE heteroserve_router_inflight\
    \ gauge\", f\"heteroserve_router_inflight {state['active']}\",\n            \"\
    # TYPE heteroserve_discovery_fresh gauge\", f\"heteroserve_discovery_fresh {int(view.fresh())}\"\
    ,\n            \"# TYPE heteroserve_ready_workers gauge\", f\"heteroserve_ready_workers\
    \ {len(view.endpoints) if view.fresh() else 0}\",\n            \"# TYPE heteroserve_router_rejected_total\
    \ counter\", f\"heteroserve_router_rejected_total {state['rejected']}\", \"\"\
    ])\n        try:\n            response = await app.state.core_client.get(\"http://127.0.0.1:29000/metrics\"\
    , timeout=3)\n            if response.status_code == 200:\n                text\
    \ += response.text\n        except httpx.HTTPError:\n            pass\n      \
    \  return Response(text, media_type=\"text/plain\")\n\n    @app.post(\"/drain\"\
    )\n    async def drain(request: Request):\n        if request.client is None or\
    \ request.client.host not in {\"127.0.0.1\", \"::1\"}:\n            raise HTTPException(403,\
    \ \"drain is local-only\")\n        state[\"draining\"] = True\n        deadline\
    \ = time.monotonic() + config[\"drain_seconds\"]\n        while state[\"active\"\
    ] and time.monotonic() < deadline:\n            await asyncio.sleep(.05)\n   \
    \     return {\"draining\": True, \"remaining_requests\": state[\"active\"]}\n\
    \n    @app.api_route(\"/v1/{path:path}\", methods=[\"GET\", \"POST\"])\n    async\
    \ def proxy(path: str, request: Request):\n        if not available():\n     \
    \       raise HTTPException(503, \"discovery is absent or expired\")\n       \
    \ capacity = sum(v.get(\"capacity\") or config[\"requests_per_worker\"] for v\
    \ in view.endpoints.values())\n        if state[\"active\"] >= capacity:\n   \
    \         state[\"rejected\"] += 1\n            raise HTTPException(429, \"pool\
    \ request capacity reached\", headers={\"Retry-After\": \"1\"})\n        state[\"\
    active\"] += 1\n        admitted_uids = set(view.endpoints)\n        upstream\
    \ = None\n        streaming = False\n        trace = request.headers.get(\"x-request-id\"\
    , uuid.uuid4().hex)\n        try:\n            chunks, size = [], 0\n        \
    \    async for chunk in request.stream():\n                size += len(chunk)\n\
    \                if size > config[\"max_request_bytes\"]:\n                  \
    \  raise HTTPException(413, \"request body is too large\")\n                chunks.append(chunk)\n\
    \            body = b\"\".join(chunks)\n            if request.method == \"POST\"\
    :\n                try:\n                    value = json.loads(body)\n      \
    \          except (json.JSONDecodeError, UnicodeDecodeError):\n              \
    \      raise HTTPException(400, \"request body must be JSON\")\n             \
    \   if not isinstance(value, dict):\n                    raise HTTPException(400,\
    \ \"request body must be a JSON object\")\n                if value.get(\"model\"\
    ) in {config[\"pool\"], config[\"expert\"]}:\n                    value[\"model\"\
    ] = config[\"model\"]\n                    body = json.dumps(value).encode()\n\
    \            headers = {k: v for k, v in request.headers.items() if k.lower()\
    \ not in HOP_HEADERS | {\"host\"}}\n            headers[\"x-request-id\"] = trace\n\
    \            if not available():\n                raise HTTPException(503, \"\
    discovery expired before dispatch\")\n            admitted_uids = set(view.endpoints)\n\
    \            upstream = await app.state.core_client.send(app.state.core_client.build_request(request.method,\
    \ \"/v1/\" + path,\n                params=request.query_params, content=body,\
    \ headers=headers), stream=True)\n            response_headers = {k: v for k,\
    \ v in upstream.headers.items() if k.lower() not in HOP_HEADERS}\n           \
    \ response_headers[\"x-request-id\"] = trace\n            worker_uid = upstream.headers.get(\"\
    x-heteroserve-pod-uid\")\n            if request.method == \"POST\" and upstream.status_code\
    \ == 200 and worker_uid not in admitted_uids:\n                raise HTTPException(503,\
    \ \"worker response identity is absent from ready discovery\")\n            if\
    \ \"text/event-stream\" in upstream.headers.get(\"content-type\", \"\"):\n   \
    \             async def stream():\n                    try:\n                \
    \        async for chunk in upstream.aiter_raw():\n                          \
    \  yield chunk\n                        state[\"completed\"] += 1\n          \
    \          finally:\n                        state[\"active\"] -= 1\n        \
    \                await asyncio.shield(upstream.aclose())\n                   \
    \     log.info(json.dumps({\"event\": \"request_finished\", \"trace\": trace,\
    \ \"worker_uid\": worker_uid, \"stream\": True}))\n                streaming =\
    \ True\n                return StreamingResponse(stream(), status_code=upstream.status_code,\
    \ headers=response_headers)\n            result = await upstream.aread()\n   \
    \         state[\"completed\"] += 1\n            return Response(result, status_code=upstream.status_code,\
    \ headers=response_headers)\n        finally:\n            if not streaming:\n\
    \                state[\"active\"] -= 1\n                if upstream is not None:\n\
    \                    await asyncio.shield(upstream.aclose())\n               \
    \ log.info(json.dumps({\"event\": \"request_finished\", \"trace\": trace, \"worker_uid\"\
    : upstream.headers.get(\"x-heteroserve-pod-uid\") if upstream else None, \"stream\"\
    : False}))\n\n    return app\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n\
    \    parser.add_argument(\"--config\", required=True)\n    args = parser.parse_args()\n\
    \    config = json.loads(Path(args.config).read_text())\n    logging.basicConfig(level=logging.INFO)\n\
    \    logging.getLogger(\"httpx\").setLevel(logging.WARNING)\n    uvicorn.run(create_app(config),\
    \ host=\"0.0.0.0\", port=8000, workers=1,\n                access_log=False, timeout_graceful_shutdown=config[\"\
    drain_seconds\"] + 5)\n\n\nif __name__ == \"__main__\":\n    main()\n"
  router.json: "{\n  \"namespace\": \"heteroserve\",\n  \"pool\": \"gptq-ascend910b-vllm\"\
    ,\n  \"expert\": \"gptq\",\n  \"model\": \"moqe-qwen3-gptq\",\n  \"core_url\"\
    : \"http://127.0.0.1:8002\",\n  \"discovery_cache_seconds\": 15,\n  \"discovery_interval_seconds\"\
    : 1,\n  \"requests_per_worker\": 8,\n  \"max_request_bytes\": 2097152,\n  \"drain_seconds\"\
    : 240,\n  \"core_command\": [\n    \"python3\",\n    \"-m\",\n    \"vllm_router.launch_router\"\
    ,\n    \"--host\",\n    \"127.0.0.1\",\n    \"--port\",\n    \"8002\",\n    \"\
    --service-discovery\",\n    \"--selector\",\n    \"app.kubernetes.io/name=expert\"\
    ,\n    \"heteroserve.io/pool=gptq-ascend910b-vllm\",\n    \"--service-discovery-namespace\"\
    ,\n    \"heteroserve\",\n    \"--service-discovery-port\",\n    \"8000\",\n  \
    \  \"--policy\",\n    \"power_of_two\",\n    \"--health-check-interval-secs\"\
    ,\n    \"2\",\n    \"--health-check-timeout-secs\",\n    \"5\",\n    \"--disable-retries\"\
    ,\n    \"--max-concurrent-requests\",\n    \"64\",\n    \"--queue-timeout-secs\"\
    ,\n    \"2\"\n  ]\n}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gptq-ascend910b-vllm-router
  namespace: heteroserve
  labels: &id001
    app.kubernetes.io/part-of: heteroserve
    app.kubernetes.io/name: router
    heteroserve.io/pool: gptq-ascend910b-vllm
    io.heteroserve.lab: heteroserve-lab
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: &id002
      app.kubernetes.io/part-of: heteroserve
      app.kubernetes.io/name: router
      heteroserve.io/pool: gptq-ascend910b-vllm
  template:
    metadata:
      labels: *id001
      annotations:
        heteroserve.io/runtime-sha256: 357cb82ef8bc18ea3156782b388a17bba1ecf91c0f1ea885ee1f90b4ca8e47c1
    spec:
      serviceAccountName: heteroserve-discovery
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 300
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - heteroserve-lab-209
                - heteroserve-lab-210
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: *id002
            topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id002
      containers:
      - name: router
        image: docker.io/heteroserve/ascend-runtime@sha256:440ec6e9625b2344a4c37733f591beeb3a9f8ade57c35dc74d873ce754cb69b4
        imagePullPolicy: Never
        command:
        - python3
        - /opt/heteroserve/router.py
        - --config
        - /opt/heteroserve/router.json
        env:
        - name: PYTHONPATH
          value: /router-deps
        - name: HOME
          value: /tmp
        - name: MOQE_ASCEND_INT4_ADAPTER
          value: '0'
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /live
            port: http
          periodSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /live
            port: http
          periodSeconds: 10
          failureThreshold: 6
        lifecycle:
          preStop:
            exec:
              command:
              - python3
              - -c
              - import urllib.request;urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/drain',method='POST'),timeout=245).read()
        volumeMounts:
        - name: runtime
          mountPath: /opt/heteroserve
          readOnly: true
        - name: deps
          mountPath: /router-deps
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: runtime
        configMap:
          name: gptq-ascend910b-vllm-router-runtime
      - name: deps
        hostPath:
          path: /var/lib/rancher/k3s/heteroserve-assets/router
          type: Directory
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gptq-ascend910b-vllm-router
  namespace: heteroserve
  labels:
    app.kubernetes.io/part-of: heteroserve
    app.kubernetes.io/name: router
    heteroserve.io/pool: gptq-ascend910b-vllm
    io.heteroserve.lab: heteroserve-lab
spec:
  selector:
    app.kubernetes.io/part-of: heteroserve
    app.kubernetes.io/name: router
    heteroserve.io/pool: gptq-ascend910b-vllm
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gptq-ascend910b-vllm-router-api
  namespace: heteroserve
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: heteroserve
      app.kubernetes.io/name: router
      heteroserve.io/pool: gptq-ascend910b-vllm
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 172.27.0.1/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 172.29.217.2/32
    ports:
    - protocol: TCP
      port: 6443
  - to:
    - ipBlock:
        cidr: 10.107.206.217/32
    ports:
    - protocol: TCP
      port: 16443
