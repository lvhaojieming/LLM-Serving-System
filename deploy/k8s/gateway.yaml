    \                   # Right padding cannot influence preceding valid tokens.\n\
    \                    return encoder(input_ids=ids, position_ids=positions,\n \
    \                       attention_mask={'full_attention': None}, use_cache=False).last_hidden_state\n\
    \                for _ in range(3):\n                    forward()\n         \
    \       torch.npu.synchronize()\n                graph = torch_npu.npu.NPUGraph()\n\
    \                with torch_npu.npu.graph(graph):\n                    hidden\
    \ = forward()\n                graph.replay()\n                torch.npu.synchronize()\n\
    \                self.entries[size] = (ids, positions, graph, hidden)\n\n    def\
    \ pooled(self, tokens):\n        length = tokens.shape[1]\n        if tokens.shape[0]\
    \ != 1:\n            raise ValueError('Embedding graphs serve exactly one prompt\
    \ at a time')\n        bucket = next((n for n in self.entries if n >= length),\
    \ None)\n        if bucket is None:\n            self.oversize += 1\n        \
    \    return None\n        ids, positions, graph, hidden = self.entries[bucket]\n\
    \        ids[:, :length].copy_(tokens)\n        graph.replay()\n        self.hits\
    \ += 1\n        return hidden[:, length-1, :]\n"
  gateway.json: "{\n  \"host\": \"0.0.0.0\",\n  \"port\": 8000,\n  \"max_inflight\"\
    : 16,\n  \"max_request_bytes\": 2097152,\n  \"timeout_seconds\": 180,\n  \"default_max_tokens\"\
    : 128,\n  \"drain_seconds\": 240,\n  \"router\": {\n    \"checkpoint\": \"/assets/router/checkpoint_best.pt\"\
    ,\n    \"checkpoint_sha256\": \"03c64f8099e3ab0c641e8584480cf0f1710a4da96478d59e4d460227b9870529\"\
    ,\n    \"tokenizer\": \"/assets/router/tokenizer\",\n    \"training_code\": \"\
    /assets/router/architecture\",\n    \"embedding_model\": \"/assets/router/embedding\"\
    ,\n    \"device\": \"npu:0\",\n    \"expert_mapping\": {\n      \"qwen3-14b/awq-w4a16/v1\"\
    : \"awq\",\n      \"qwen3-14b/gptq-w4a16/v1\": \"gptq\"\n    },\n    \"embedding_graph\"\
    : false,\n    \"graph_buckets\": [\n      64,\n      128,\n      256,\n      512,\n\
    \      1024\n    ],\n    \"graph_threshold_margin\": 0.01\n  },\n  \"pools\":\
    \ {\n    \"awq\": {\n      \"enabled\": true,\n      \"base_url\": \"http://awq-ascend910b-vllm-router.heteroserve.svc.cluster.local:8000/v1\"\
    ,\n      \"model\": \"awq\"\n    },\n    \"gptq\": {\n      \"enabled\": false,\n\
    \      \"base_url\": null,\n      \"model\": \"gptq\"\n    }\n  },\n  \"deployment\"\
    : {\n    \"node\": \"heteroserve-lab-209\",\n    \"asset_path\": \"/var/lib/rancher/k3s/heteroserve-assets/router-model\"\
    ,\n    \"asset_source_host\": \"10.107.206.212\",\n    \"asset_source_root\":\
    \ \"/root/zhangjinhao/router-single-npu\",\n    \"source_checkpoint\": \"router-training/contextual-multitask-v7/mlp-seed20261005/checkpoint_best.pt\"\
    ,\n    \"source_embedding\": \"models/Qwen3-Embedding-0.6B\",\n    \"source_tokenizer\"\
    : \"router-base-embedding\",\n    \"source_architecture\": \"MLsys/src/moqe_router\"\
    \n  },\n  \"migration_source\": {\n    \"repository\": \"https://github.com/lvhaojieming/MLsys_inference.git\"\
    ,\n    \"commit\": \"5c81fe24085c9c1260dcb9cf9001909261d52328\",\n    \"score_semantics\"\
    : \"expert_probabilities\",\n    \"selection_policy\": \"checkpoint_binary_threshold\"\
    \n  }\n}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heteroserve-gateway
  namespace: heteroserve
  labels: &id001
    app.kubernetes.io/part-of: heteroserve
    app.kubernetes.io/name: gateway
    io.heteroserve.lab: heteroserve-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        heteroserve.io/runtime-sha256: 772fdda2c447f4d675bb0f34e3864ccf5772cf05da2d9ad45b71dfd5533780b4
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      nodeSelector:
        kubernetes.io/hostname: heteroserve-lab-209
        heteroserve.io/npu-ready: 'true'
      containers:
      - name: gateway
        image: docker.io/heteroserve/ascend-runtime@sha256:440ec6e9625b2344a4c37733f591beeb3a9f8ade57c35dc74d873ce754cb69b4
        imagePullPolicy: Never
        command:
        - bash
        - -ec
        args:
        - source /usr/local/Ascend/ascend-toolkit/set_env.sh; source /usr/local/Ascend/nnal/atb/set_env.sh;
          exec python3 -m heteroserve.gateway --config /opt/runtime/gateway.json
        env:
        - name: PYTHONPATH
          value: /opt/runtime:/workspace/zhangjinhao/moqe-runtime/python-deps
        - name: HOME
          value: /scratch
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: MOQE_ASCEND_INT4_ADAPTER
          value: '0'
        - name: TE_PARALLEL_COMPILER
          value: '1'
        - name: OMP_NUM_THREADS
          value: '4'
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
            huawei.com/Ascend910: '1'
          limits:
            huawei.com/Ascend910: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /live
            port: http
          periodSeconds: 5
          failureThreshold: 240
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /live
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        lifecycle:
          preStop:
            exec:
              command:
              - python3
              - -c
              - import urllib.request;urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/drain',method='POST'),timeout=245).read()
        volumeMounts:
        - name: runtime
          mountPath: /opt/runtime
          readOnly: true
        - name: assets
          mountPath: /assets/router
          readOnly: true
        - name: driver
          mountPath: /usr/local/Ascend/driver
          readOnly: true
        - name: deps
          mountPath: /workspace/zhangjinhao/moqe-runtime/python-deps
          readOnly: true
        - name: scratch
          mountPath: /scratch
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: runtime
        configMap:
          name: heteroserve-gateway
          items:
          - key: heteroserve--__init__.py
            path: heteroserve/__init__.py
          - key: heteroserve--gateway.py
            path: heteroserve/gateway.py
          - key: heteroserve--routing--__init__.py
            path: heteroserve/routing/__init__.py
          - key: heteroserve--routing--runtime.py
            path: heteroserve/routing/runtime.py
          - key: heteroserve--routing--ascend.py
            path: heteroserve/routing/ascend.py
          - key: heteroserve--routing--embedding_graph.py
            path: heteroserve/routing/embedding_graph.py
          - key: gateway.json
            path: gateway.json
      - name: scratch
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: assets
        hostPath:
          path: /var/lib/rancher/k3s/heteroserve-assets/router-model
          type: Directory
      - name: driver
        hostPath:
          path: /usr/local/Ascend/driver
          type: Directory
      - name: deps
        hostPath:
          path: /var/lib/rancher/k3s/heteroserve-assets/adapter/python-deps
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: heteroserve-gateway
  namespace: heteroserve
  labels: &id001
    app.kubernetes.io/part-of: heteroserve
    app.kubernetes.io/name: gateway
    io.heteroserve.lab: heteroserve-lab
spec:
  selector: *id001
  ports:
  - name: http
    port: 8000
    targetPort: http
